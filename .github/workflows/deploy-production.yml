name: Production Deployment

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          run-install: true

      - name: Build & deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_R2_URL: ${{ vars.VITE_R2_URL }}
          CLOUDFLARE_ENV: production
        run: vp run deploy:production

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLOUDFLARE_EMAIL_SERVICE_URL: ${{ secrets.CLOUDFLARE_EMAIL_SERVICE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | vp exec wrangler secret put CLOUDFLARE_ACCOUNT_ID --config dist/server/wrangler.json
          printf '%s' "$CLOUDFLARE_API_TOKEN" | vp exec wrangler secret put CLOUDFLARE_ACCESS_TOKEN --config dist/server/wrangler.json
          printf '%s' "$AUTH_SECRET" | vp exec wrangler secret put AUTH_SECRET --config dist/server/wrangler.json
          printf '%s' "$CLOUDFLARE_EMAIL_SERVICE_URL" | vp exec wrangler secret put CLOUDFLARE_EMAIL_SERVICE_URL --config dist/server/wrangler.json
          printf '%s' "$SENTRY_AUTH_TOKEN" | vp exec wrangler secret put SENTRY_AUTH_TOKEN --config dist/server/wrangler.json
