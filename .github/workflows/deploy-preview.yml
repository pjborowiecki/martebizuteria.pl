name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true
          run-install: true

      - name: Build & deploy to preview
        env:
          CLOUDFLARE_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          CLOUDFLARE_ENV: preview
        run: bun run deploy:preview

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLOUDFLARE_EMAIL_SERVICE_URL: ${{ secrets.CLOUDFLARE_EMAIL_SERVICE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | wrangler secret put CLOUDFLARE_ACCOUNT_ID --config dist/server/wrangler.json
          printf '%s' "$CLOUDFLARE_ACCESS_TOKEN" | wrangler secret put CLOUDFLARE_ACCESS_TOKEN --config dist/server/wrangler.json
          printf '%s' "$AUTH_SECRET" | wrangler secret put AUTH_SECRET --config dist/server/wrangler.json
          printf '%s' "$CLOUDFLARE_EMAIL_SERVICE_URL" | wrangler secret put CLOUDFLARE_EMAIL_SERVICE_URL --config dist/server/wrangler.json
          printf '%s' "$SENTRY_AUTH_TOKEN" | wrangler secret put SENTRY_AUTH_TOKEN --config dist/server/wrangler.json

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://martebizuteria-preview.pjborowiecki.workers.dev';
            const body = `## 🚀 Preview Deployment\n\nYour preview is ready at: **[${url}](${url})**\n\n_Deployed from commit \`${{ github.sha }}\`_`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes('Preview Deployment'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
