name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          run-install: true

      - name: Build & deploy to preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_R2_URL: ${{ vars.VITE_R2_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          CLOUDFLARE_ENV: preview
        run: vp run deploy:preview

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          RESEND_EMAIL_FROM: ${{ secrets.RESEND_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | vp exec wrangler secret put CLOUDFLARE_ACCOUNT_ID --config dist/server/wrangler.json
          printf '%s' "$CLOUDFLARE_API_TOKEN" | vp exec wrangler secret put CLOUDFLARE_ACCESS_TOKEN --config dist/server/wrangler.json
          printf '%s' "$AUTH_SECRET" | vp exec wrangler secret put AUTH_SECRET --config dist/server/wrangler.json
          printf '%s' "$AUTH_GOOGLE_CLIENT_ID" | vp exec wrangler secret put AUTH_GOOGLE_CLIENT_ID --config dist/server/wrangler.json
          printf '%s' "$AUTH_GOOGLE_CLIENT_SECRET" | vp exec wrangler secret put AUTH_GOOGLE_CLIENT_SECRET --config dist/server/wrangler.json
          printf '%s' "$AUTH_GITHUB_CLIENT_ID" | vp exec wrangler secret put AUTH_GITHUB_CLIENT_ID --config dist/server/wrangler.json
          printf '%s' "$AUTH_GITHUB_CLIENT_SECRET" | vp exec wrangler secret put AUTH_GITHUB_CLIENT_SECRET --config dist/server/wrangler.json
          printf '%s' "$RESEND_EMAIL_FROM" | vp exec wrangler secret put RESEND_EMAIL_FROM --config dist/server/wrangler.json
          printf '%s' "$RESEND_API_KEY" | vp exec wrangler secret put RESEND_API_KEY --config dist/server/wrangler.json
          printf '%s' "$SENTRY_AUTH_TOKEN" | vp exec wrangler secret put SENTRY_AUTH_TOKEN --config dist/server/wrangler.json
          printf '%s' "$STRIPE_SECRET_KEY" | vp exec wrangler secret put STRIPE_SECRET_KEY --config dist/server/wrangler.json
          printf '%s' "$STRIPE_WEBHOOK_SECRET" | vp exec wrangler secret put STRIPE_WEBHOOK_SECRET --config dist/server/wrangler.json
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://martebizuteria-preview.pjborowiecki.workers.dev';
            const body = `## 🚀 Preview Deployment\n\nYour preview is ready at: **[${url}](${url})**\n\n_Deployed from commit \`${{ github.sha }}\`_`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes('Preview Deployment'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
