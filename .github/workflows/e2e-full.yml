name: E2E (full)

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'push' && fromJSON('["webkit"]') || fromJSON('["chromium", "webkit"]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      browser: ${{ matrix.browser }}

  stripe-test-mode:
    name: E2E (Stripe test mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          test-environment: "true"
      - name: Create and seed the local D1 database
        run: bun run db:reset:test
      - name: Build the local Cloudflare test environment with the sandbox keys
        run: bun run build:test
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('bun.lock') }}
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Pay through Stripe test mode
        run: bun run test:e2e:stripe
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-stripe-test-mode
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
