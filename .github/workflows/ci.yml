name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          run-install: true

      - name: Format, lint & type check
        run: vp check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          run-install: true

      - name: Run tests
        run: vp test --run
