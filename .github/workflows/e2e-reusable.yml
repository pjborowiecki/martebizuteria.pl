name: E2E (reusable)

on:
  workflow_call:
    inputs:
      browser:
        description: Playwright project to run.
        required: true
        type: string
      suite:
        description: Playwright test path to run.
        required: false
        type: string
        default: e2e/specs

permissions:
  contents: read

jobs:
  e2e:
    name: Build and E2E (${{ inputs.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          test-environment: "true"
      - name: Create and seed the local D1 database
        run: bun run db:reset:test
      - name: Build the local Cloudflare test environment
        run: bun run build:test
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ inputs.browser }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright browser
        run: bunx playwright install --with-deps ${{ inputs.browser }}
      - name: E2E suite
        run: bunx playwright test ${{ inputs.suite }} --project=${{ inputs.browser }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ inputs.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
